name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    # The whole suite on two standalone servers, which GitHub's service
    # containers give: they cannot mount the cluster config, so the tests
    # gated by CLICKHOUSE_CLUSTER_AVAILABLE are skipped here and run in the
    # cluster job.
    name: ClickHouse ${{ matrix.clickhouse }} · two standalone servers (cluster tests skipped) · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        # 24.8 is the oldest ClickHouse release this package supports; 26.3 and 26.8 are the current LTS releases.
        clickhouse: ['24.8', '26.3', '26.8']

    services:
      clickhouse01:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports: ['18123:8123']
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ''
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
      clickhouse02:
        image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        ports: ['18124:8123']
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ''
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # GrammarLiteralTest checks that floats are written with a dot under a locale with a decimal comma, and skips
      # when none is installed; the runner image has none.
      - name: Generate a locale with a decimal comma
        run: sudo locale-gen de_DE.UTF-8

      - name: Wait for ClickHouse
        run: |
          for host in 18123 18124; do
            for i in {1..30}; do
              if curl -sf "http://127.0.0.1:${host}/?query=SELECT%201" > /dev/null; then
                echo "clickhouse on :${host} ready"; break
              fi
              sleep 2
            done
          done

      - name: Run PHPUnit
        run: |
          # Gate cluster tests off: CI service containers cannot mount
          # tests/docker/clickhouse0*/config.xml, so company_cluster and
          # the {replica}/{shard} macros do not exist here. The cluster
          # job below runs them.
          sed -i 's|CLICKHOUSE_CLUSTER_AVAILABLE" value="1"|CLICKHOUSE_CLUSTER_AVAILABLE" value="0"|' phpunit.xml
          vendor/bin/phpunit --testdox

  cluster:
    # The whole suite on the two-node test cluster of docker-compose.test.yaml
    # (company_cluster, its macros and ZooKeeper), as it runs locally, so the
    # tests gated by CLICKHOUSE_CLUSTER_AVAILABLE run too.
    name: ClickHouse ${{ matrix.clickhouse }} · two-node cluster with ZooKeeper (all tests) · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        clickhouse: ['24.8', '26.3', '26.8']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # GrammarLiteralTest checks that floats are written with a dot under a locale with a decimal comma, and skips
      # when none is installed; the runner image has none.
      - name: Generate a locale with a decimal comma
        run: sudo locale-gen de_DE.UTF-8

      - name: Start the ClickHouse cluster
        env:
          CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
        run: docker compose -f docker-compose.test.yaml up -d

      - name: Wait for ClickHouse and ZooKeeper
        run: |
          # Each node is ready once it answers and reaches ZooKeeper: the root
          # znode always has a child (/zookeeper).
          for port in 18123 18124; do
            for i in {1..60}; do
              children=$(curl -sf "http://127.0.0.1:${port}/" --data-binary "SELECT count() FROM system.zookeeper WHERE path = '/'" || true)
              if [ "${children:-0}" -gt 0 ] 2> /dev/null; then
                echo "clickhouse on :${port} reaches ZooKeeper"; continue 2
              fi
              sleep 2
            done
            echo "clickhouse on :${port} is not ready"; exit 1
          done

      - name: Run PHPUnit
        env:
          CLICKHOUSE_CLUSTER_AVAILABLE: '1'
        run: vendor/bin/phpunit --testdox

      - name: Show the ClickHouse logs
        if: failure()
        run: docker compose -f docker-compose.test.yaml logs --tail 200
